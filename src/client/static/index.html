<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Encourage the browser to revalidate this entry page rather than serve a stale copy. -->
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>Multiplayr</title>
    <!-- Favicon: the four header marks (square, circle, triangle, square). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='14' height='14' fill='%23e1553a'/%3E%3Ccircle cx='24' cy='8' r='7' fill='%231c8c7d'/%3E%3Cpolygon points='8,17.5 15,31 1,31' fill='%23e3a81e'/%3E%3Crect x='17' y='17' width='14' height='14' fill='%2333507a'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Mid-century palette — shared with host_p2p.html / join_p2p.html */
            --bg:        #ece4d3;
            --surface:   #fbf8f1;
            --ink:       #221f1a;
            --ink-soft:  #6b6455;
            --hairline:  #ddd3bf;

            --mustard:   #e3a81e;
            --teal:      #1c8c7d;
            --coral:     #e1553a;
            --navy:      #33507a;
            --olive:     #6e8b3d;
            --plum:      #7b4b72;
            --cream:     #fbf8f1;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px 24px 110px;
            -webkit-font-smoothing: antialiased;
        }

        .landing {
            width: 100%;
            max-width: 880px;
        }

        /* ---------- Header ---------- */
        .site-header { margin-bottom: 44px; }

        .site-header__marks {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }
        .site-header__marks span { width: 26px; height: 26px; }
        .site-header__marks .m-sq   { background: var(--coral); }
        .site-header__marks .m-cir  { background: var(--teal); border-radius: 50%; }
        .site-header__marks .m-tri  {
            width: 0; height: 0; background: transparent;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-bottom: 26px solid var(--mustard);
        }
        .site-header__marks .m-navy { background: var(--navy); }

        .site-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 9vw, 5.6rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.92;
            margin: 0;
        }

        .site-subtitle {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--ink-soft);
            margin: 16px 0 0;
            max-width: 44ch;
        }

        /* ---------- Action panels ---------- */
        .actions {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 22px;
        }

        .action {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 260px;
            padding: 28px 30px 30px;
            text-decoration: none;
            color: var(--cream);
            transition: transform 0.14s ease;
        }
        .action:hover { transform: translateY(-5px); }
        .action:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

        .action--host { background: var(--coral); }
        .action--join { background: var(--teal); }

        .action__text,
        .action__cta { position: relative; z-index: 1; }

        .action__kicker {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            opacity: 0.8;
        }

        .action__title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.2rem, 5vw, 3rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 0.95;
            margin: 10px 0 12px;
        }

        .action__desc {
            font-size: 1rem;
            line-height: 1.5;
            max-width: 30ch;
            margin: 0 0 24px;
            opacity: 0.92;
        }

        .action__cta {
            align-self: flex-start;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            padding: 11px 24px;
            border-radius: 999px;
            background: var(--cream);
            color: var(--ink);
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .action:hover .action__cta { background: var(--ink); color: var(--cream); }

        /* Flat geometric shapes bled off the corner of each panel. */
        .action__shape { position: absolute; pointer-events: none; z-index: 0; }
        .action--host .shape-a {
            right: -70px; bottom: -70px;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: var(--mustard);
        }
        .action--host .shape-b {
            right: 120px; bottom: -28px;
            width: 64px; height: 64px;
            background: var(--navy);
        }
        .action--join .shape-a {
            right: -36px; bottom: -20px;
            width: 0; height: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-bottom: 150px solid var(--navy);
        }
        .action--join .shape-b {
            right: 28px; top: 28px;
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--mustard);
        }

        /* ---------- Build version + force refresh ---------- */
        .version-bar {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.74rem;
            color: var(--ink-soft);
            background: rgba(251, 248, 241, 0.92);
            padding: 5px 5px 5px 14px;
            border: 1px solid var(--hairline);
            border-radius: 999px;
            z-index: 100;
        }
        .version-label {
            font-weight: 600;
            white-space: nowrap;
        }
        .version-refresh {
            font-family: 'Outfit', sans-serif;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            color: var(--cream);
            background: var(--ink);
            border: none;
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease;
        }
        .version-refresh:hover { background: var(--coral); }
        .version-refresh:disabled { opacity: 0.6; cursor: default; }

        @media (max-width: 640px) {
            body { padding: 40px 16px 100px; align-items: flex-start; }
            .site-header { margin-bottom: 32px; }
            .actions { grid-template-columns: 1fr; gap: 16px; }
            .action { min-height: 210px; padding: 24px; }
        }
    </style>
</head>
<body>

    <main class="landing">
        <header class="site-header">
            <div class="site-header__marks" aria-hidden="true">
                <span class="m-sq"></span>
                <span class="m-cir"></span>
                <span class="m-tri"></span>
                <span class="m-navy"></span>
            </div>
            <h1 class="site-title">Multiplayr</h1>
            <p class="site-subtitle">Peer-to-peer game night. One screen hosts the table, everyone else joins from their phone.</p>
        </header>

        <nav class="actions">
            <a href="host_p2p.html" class="action action--host">
                <span class="action__shape shape-a" aria-hidden="true"></span>
                <span class="action__shape shape-b" aria-hidden="true"></span>
                <div class="action__text">
                    <div class="action__kicker">Start a table</div>
                    <div class="action__title">Host a room</div>
                    <p class="action__desc">Pick a game and share the room code with your friends.</p>
                </div>
                <span class="action__cta">Host &rarr;</span>
            </a>

            <a href="join_p2p.html" class="action action--join">
                <span class="action__shape shape-a" aria-hidden="true"></span>
                <span class="action__shape shape-b" aria-hidden="true"></span>
                <div class="action__text">
                    <div class="action__kicker">Got a code?</div>
                    <div class="action__title">Join a game</div>
                    <p class="action__desc">Enter the host&rsquo;s room code to take your seat.</p>
                </div>
                <span class="action__cta">Join &rarr;</span>
            </a>
        </nav>
    </main>

    <!-- Build version + manual cache buster -->
    <div class="version-bar">
        <span class="version-label">Build __MP_BUILD_VERSION__</span>
        <button id="force-refresh" class="version-refresh" type="button"
                title="Clear cached files and reload the latest published version">
            &#8635; Force refresh
        </button>
    </div>

    <script>
        (function () {
            var btn = document.getElementById('force-refresh');
            if (!btn) { return; }

            var navigated = false;
            function reloadFresh() {
                if (navigated) { return; }
                navigated = true;
                try {
                    var url = new URL(window.location.href);
                    // A changing query string forces the browser to re-request the
                    // document from the server instead of serving it from cache.
                    url.searchParams.set('_', Date.now().toString());
                    window.location.replace(url.toString());
                } catch (e) {
                    window.location.reload();
                }
            }

            btn.addEventListener('click', function () {
                btn.disabled = true;
                btn.textContent = 'Refreshing…';

                var tasks = [];
                try {
                    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
                        tasks.push(
                            navigator.serviceWorker.getRegistrations().then(function (regs) {
                                return Promise.all(regs.map(function (r) { return r.unregister(); }));
                            }).catch(function () {})
                        );
                    }
                    if (window.caches && window.caches.keys) {
                        tasks.push(
                            window.caches.keys().then(function (keys) {
                                return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                            }).catch(function () {})
                        );
                    }
                } catch (e) { /* Storage APIs unavailable — just reload. */ }

                if (tasks.length) {
                    Promise.all(tasks).then(reloadFresh, reloadFresh);
                } else {
                    reloadFresh();
                }
                // Safety net in case the storage APIs never settle.
                setTimeout(reloadFresh, 1500);
            });
        })();
    </script>

</body>
</html>
