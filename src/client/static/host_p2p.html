<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <!-- Revalidate this page so republished bundles (new ?v=) are picked up. -->
        <meta http-equiv="Cache-Control" content="no-cache">
        <title>Multiplayr: Host</title>

        <!-- Geometric + text sans -->
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <script src="https://code.jquery.com/jquery-3.5.1.min.js"
                integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
                crossorigin="anonymous"></script>
        <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
        <script src="lib.bundle.js?v=__MP_BUILD_VERSION__"></script>
        <script src="rules.bundle.js?v=__MP_BUILD_VERSION__"></script>
        <script src="host_p2p.bundle.js?v=__MP_BUILD_VERSION__"></script>
        <script src="https://use.fontawesome.com/0c388157c6.js"></script>
        <style>
            :root {
                /* Mid-century palette — bold, high-contrast, flat */
                --bg:        #ece4d3;
                --surface:   #fbf8f1;
                --ink:       #221f1a;
                --ink-soft:  #6b6455;
                --hairline:  #ddd3bf;

                --mustard:   #e3a81e;
                --teal:      #1c8c7d;
                --coral:     #e1553a;
                --navy:      #33507a;
                --olive:     #6e8b3d;
                --plum:      #7b4b72;
                --cream:     #fbf8f1;
            }

            * { box-sizing: border-box; }

            body {
                background-color: var(--bg);
                color: var(--ink);
                font-family: 'Inter', sans-serif;
                margin: 0;
                padding: 56px 24px 96px;
                -webkit-font-smoothing: antialiased;
            }

            .container {
                max-width: 1140px;
                margin: 0 auto;
            }

            /* ---------- Header ---------- */
            .site-header {
                margin-bottom: 48px;
            }

            .site-header__marks {
                display: flex;
                gap: 10px;
                margin-bottom: 22px;
            }
            .site-header__marks span {
                width: 26px;
                height: 26px;
            }
            .site-header__marks .m-sq   { background: var(--coral); }
            .site-header__marks .m-cir  { background: var(--teal); border-radius: 50%; }
            .site-header__marks .m-tri  {
                width: 0; height: 0; background: transparent;
                border-left: 13px solid transparent;
                border-right: 13px solid transparent;
                border-bottom: 26px solid var(--mustard);
            }
            .site-header__marks .m-navy { background: var(--navy); }

            .site-title {
                font-family: 'Outfit', sans-serif;
                font-size: clamp(2.6rem, 6vw, 4.2rem);
                font-weight: 900;
                letter-spacing: -0.04em;
                line-height: 0.95;
                margin: 0;
                color: var(--ink);
            }

            .site-subtitle {
                font-size: 1.1rem;
                font-weight: 500;
                color: var(--ink-soft);
                margin: 14px 0 0;
                max-width: 46ch;
            }

            /* ---------- Room status ---------- */
            #room-info {
                font-weight: 700;
                font-size: 1.05rem;
                padding: 18px 26px;
                margin-bottom: 44px;
                letter-spacing: 0.01em;
                transition: background-color 0.25s ease, color 0.25s ease;
            }
            #room-info.connecting { background-color: var(--mustard); color: var(--ink); }
            #room-info.connected  { background-color: var(--teal);    color: var(--cream); }

            /* ---------- Filter bar ---------- */
            .filter-bar { margin-bottom: 44px; }

            .filter-bar__label {
                font-family: 'Outfit', sans-serif;
                font-size: 0.8rem;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                color: var(--ink-soft);
                margin: 0 0 16px;
            }

            .filter-bar__chips {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .chip {
                font-family: 'Inter', sans-serif;
                font-size: 0.9rem;
                font-weight: 600;
                padding: 9px 18px;
                border-radius: 999px;
                background: var(--surface);
                color: var(--ink);
                cursor: pointer;
                user-select: none;
                transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
                white-space: nowrap;
            }
            .chip .chip__count {
                color: var(--ink-soft);
                font-weight: 500;
                margin-left: 6px;
            }
            .chip:hover { transform: translateY(-1px); }
            .chip.is-active {
                background: var(--ink);
                color: var(--cream);
            }
            .chip.is-active .chip__count { color: rgba(251, 248, 241, 0.6); }

            /* ---------- Game grid ---------- */
            .game-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
                gap: 26px;
            }

            .game-card {
                background: var(--surface);
                display: flex;
                flex-direction: column;
                cursor: pointer;
                overflow: hidden;
                transition: transform 0.14s ease;
            }
            .game-card:hover { transform: translateY(-5px); }

            .game-card__banner {
                display: flex;
                align-items: center;
                padding: 22px 24px;
            }
            .game-card__title {
                font-family: 'Outfit', sans-serif;
                font-size: 1.5rem;
                font-weight: 800;
                letter-spacing: -0.02em;
                line-height: 1.05;
                margin: 0;
            }

            .game-card__body {
                position: relative;
                overflow: hidden;
                padding: 22px 24px 24px;
                display: flex;
                flex-direction: column;
                flex-grow: 1;
            }

            /* Geometric icon imprinted large in the bottom-right, bled off-corner. */
            .game-card__watermark {
                position: absolute;
                right: -14%;
                bottom: -16%;
                width: 62%;
                aspect-ratio: 1 / 1;
                opacity: 0.16;
                pointer-events: none;
                z-index: 0;
            }
            .game-card__watermark svg { display: block; width: 100%; height: 100%; }

            .game-card__desc,
            .game-card__tags,
            .game-card__players { position: relative; z-index: 1; }

            .game-card__desc {
                font-size: 0.98rem;
                line-height: 1.5;
                color: var(--ink);
                margin: 0 0 20px;
            }

            .game-card__tags {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 18px;
            }
            .tag {
                font-size: 0.78rem;
                font-weight: 600;
                padding: 5px 12px;
                border-radius: 999px;
                background: rgba(34, 31, 26, 0.08);
                color: var(--ink-soft);
                cursor: pointer;
                transition: background-color 0.15s ease, color 0.15s ease;
            }
            .tag:hover { background: var(--ink); color: var(--cream); }
            .tag.is-active { background: var(--ink); color: var(--cream); }

            .game-card__players {
                margin-top: auto;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--ink-soft);
                display: flex;
                align-items: center;
                gap: 7px;
            }

            .grid-empty {
                grid-column: 1 / -1;
                padding: 40px 0;
                font-size: 1.05rem;
                color: var(--ink-soft);
            }

            /* ---------- Join action ---------- */
            #actions { margin-top: 56px; }
            .join-p2p-btn {
                display: inline-block;
                background: var(--coral);
                color: var(--cream);
                font-family: 'Outfit', sans-serif;
                font-size: 1.05rem;
                font-weight: 800;
                letter-spacing: 0.01em;
                padding: 15px 34px;
                border-radius: 999px;
                text-decoration: none;
                transition: background-color 0.15s ease, transform 0.1s ease;
            }
            .join-p2p-btn:hover { background: #c9432a; color: var(--cream); transform: translateY(-2px); }

            /* ---------- Build version badge ---------- */
            .build-badge {
                position: fixed;
                bottom: 8px;
                right: 10px;
                font-family: 'Inter', sans-serif;
                font-size: 0.72rem;
                font-weight: 600;
                color: var(--ink-soft);
                background: rgba(251, 248, 241, 0.85);
                padding: 4px 10px;
                border: 1px solid var(--hairline);
                border-radius: 999px;
                z-index: 50;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="host-setup-ui" class="container">
            <header class="site-header">
                <div class="site-header__marks" aria-hidden="true">
                    <span class="m-sq"></span>
                    <span class="m-cir"></span>
                    <span class="m-tri"></span>
                    <span class="m-navy"></span>
                </div>
                <h1 class="site-title">Multiplayr</h1>
                <p class="site-subtitle">Peer-to-peer game night. Filter by what you feel like playing, then pick a game to host.</p>
            </header>

            <div id="room-info" class="connecting">
                Connecting to WebRTC&hellip;
            </div>

            <div id="mechanic-filter" class="filter-bar"></div>

            <div id="rules" class="game-grid"></div>

            <div id="actions">
                <a href="/join_p2p" class="join-p2p-btn">Join a P2P Game</a>
            </div>
        </div>

        <div id="game-container" style="display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; background-color: #ffffff; z-index: 9999;"></div>

        <div class="build-badge">Build __MP_BUILD_VERSION__</div>
    </body>
</html>
